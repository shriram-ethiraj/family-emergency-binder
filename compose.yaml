services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
      args:
        NODE_VERSION: ${NODE_VERSION:-24.21.0}
    init: true
    restart: unless-stopped
    expose:
      - "4173"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "4173"
      VAULT_DIR: /vault
      OUTPUT_DIR: /output
      DEFINITIONS_DIR: /app/definitions
      TEMPLATE_CACHE_DIR: /template-cache
    volumes:
      - type: bind
        source: ${VAULT_DIR:-./vault-data}
        target: /vault
      - type: bind
        source: ${OUTPUT_DIR:-./output}
        target: /output
      - type: bind
        source: ${TEMPLATE_CACHE_DIR:-./runtime-data/template-cache}
        target: /template-cache
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runtime
      args:
        NODE_VERSION: ${NODE_VERSION:-24.21.0}
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-4173}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
