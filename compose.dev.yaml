x-backend-development-build: &backend-development-build
  context: .
  dockerfile: apps/backend/Dockerfile
  target: development
  args:
    NODE_VERSION: ${NODE_VERSION:-24.21.0}

x-backend-runtime-build: &backend-runtime-build
  context: .
  dockerfile: apps/backend/Dockerfile
  target: runtime
  args:
    NODE_VERSION: ${NODE_VERSION:-24.21.0}

x-storage-volumes: &storage-volumes
  - type: bind
    source: ${VAULT_DIR:-./vault-data}
    target: /vault
  - type: bind
    source: ${OUTPUT_DIR:-./output}
    target: /output
  - type: bind
    source: ${TEMPLATE_CACHE_DIR:-./runtime-data/template-cache}
    target: /template-cache

services:
  storage-init:
    build:
      <<: *backend-runtime-build
    user: "0:0"
    entrypoint: ["node", "dist/storage-init.js"]
    command: []
    volumes: *storage-volumes
    network_mode: none
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  backend:
    build:
      <<: *backend-development-build
    init: true
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      HOST: "0.0.0.0"
      PORT: "4173"
      VAULT_DIR: /vault
      OUTPUT_DIR: /output
      DEFINITIONS_DIR: /app/definitions
      TEMPLATE_CACHE_DIR: /template-cache
    volumes:
      - type: bind
        source: ./apps/backend
        target: /app/apps/backend
      - type: bind
        source: ./definitions
        target: /app/definitions
        read_only: true
      - type: bind
        source: ${VAULT_DIR:-./vault-data}
        target: /vault
      - type: bind
        source: ${OUTPUT_DIR:-./output}
        target: /output
      - type: bind
        source: ${TEMPLATE_CACHE_DIR:-./runtime-data/template-cache}
        target: /template-cache
    expose:
      - "4173"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: development
      args:
        NODE_VERSION: ${NODE_VERSION:-24.21.0}
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_WEB_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      DOCKER_DEV: "true"
      VITE_DEV_API_TARGET: "http://backend:4173"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
    volumes:
      - type: bind
        source: ./apps/frontend
        target: /app/apps/frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
